[book]
title = "ripgrep User Guide"
authors = ["Andrew Gallant"]
description = "A comprehensive guide to using ripgrep, a line-oriented search tool"
language = "en"
multilingual = false
src = "src"

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "dark"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/BurntSushi/ripgrep"
edit-url-template = "https://github.com/iepathos/ripgrep/edit/master/book/{path}"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true

[output.html.fold]
enable = true
level = 0

[output.html.playground]
editable = false
