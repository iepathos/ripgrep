site_name: ripgrep User Guide
site_description: A comprehensive guide to using ripgrep, a line-oriented search tool
site_author: Andrew Gallant
site_url: https://github.com/BurntSushi/ripgrep

repo_name: BurntSushi/ripgrep
repo_url: https://github.com/BurntSushi/ripgrep
edit_uri: edit/master/docs/

# Use docs as documentation directory
docs_dir: docs

# Exclude mdbook-specific files from MkDocs
exclude_docs: |
  SUMMARY.md

theme:
  name: material
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate


plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js

# Navigation structure (matching SUMMARY.md)
nav:
  - Home: index.md
  - User Guide:
      - Basics:
          - basics/index.md
          - Pattern Matching: basics/pattern-matching.md
          - Literal String Search: basics/literal-search.md
          - Regular Expressions: basics/regex-basics.md
          - Case Sensitivity: basics/case-sensitivity.md
          - Word and Line Boundaries: basics/boundaries.md
          - Output Format: basics/output.md
          - Count and List Modes: basics/count-list.md
          - Practice Examples: basics/practice.md
      - Recursive Search: recursive-search.md
      - Automatic Filtering: automatic-filtering.md
      - Manual Filtering (Globs): manual-filtering-globs.md
      - Manual Filtering (File Types): manual-filtering-types.md
      - Replacements: replacements.md
      - Configuration File: configuration-file.md
      - File Encoding: file-encoding.md
      - Binary Data:
          - binary-data/index.md
          - Binary Detection: binary-data/detection.md
          - Binary Modes: binary-data/modes.md
          - Explicit vs Implicit Files: binary-data/explicit-implicit.md
          - Binary Flags Reference: binary-data/flags.md
          - Examples and Troubleshooting: binary-data/examples.md
      - Compressed Files: compressed-files.md
      - Preprocessor: preprocessor.md
      - Common Options:
          - common-options/index.md
          - Search Basics: common-options/search-basics.md
          - Output Formatting: common-options/output-formatting.md
          - File Filtering: common-options/file-filtering.md
          - Output Modes: common-options/output-modes.md
          - Quick Reference: common-options/reference.md
      - Context Lines: context-lines.md
      - Output Formats: output-formats.md
      - Sorting Results: sorting-results.md
      - Utility Modes: utility-modes.md
  - Advanced Topics:
      - Advanced Patterns:
          - advanced-patterns/index.md
          - Multiline Search: advanced-patterns/multiline.md
          - PCRE2 Engine: advanced-patterns/pcre2.md
          - Lookaround Assertions: advanced-patterns/lookaround.md
          - Backreferences: advanced-patterns/backreferences.md
          - Unicode Patterns: advanced-patterns/unicode.md
          - Inline Regex Flags: advanced-patterns/inline-flags.md
          - Performance Considerations: advanced-patterns/performance.md
          - Practical Examples: advanced-patterns/examples.md
      - Performance: performance.md
      - Statistics and Metrics: statistics.md
      - Hyperlinks: hyperlinks.md
      - Troubleshooting:
          - troubleshooting/index.md
          - Debug Flags: troubleshooting/debug-flags.md
          - No Results Found: troubleshooting/no-results.md
          - Performance Issues: troubleshooting/performance.md
          - Common Error Messages: troubleshooting/errors.md
          - Binary and Encoding Problems: troubleshooting/binary-encoding.md
          - When to File a Bug: troubleshooting/bug-reports.md
